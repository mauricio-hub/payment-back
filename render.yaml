services:
  - type: web
    name: payment-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/products
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: payment-db
          property: connectionString
      - key: PAYMENT_API_URL
        sync: false
      - key: PAYMENT_API_KEY
        sync: false
      - key: PAYMENT_PUBLIC_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: payment-db
    databaseName: payment
    user: payment_user
